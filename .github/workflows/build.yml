name: Nightly Build

on:
    workflow_dispatch:
    push:

permissions:
    contents: read
    packages: write

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Get branch name
              id: get_branch
              run: echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

            - name: Set up JDK 25
              uses: actions/setup-java@v4
              with:
                  java-version: 25
                  distribution: temurin
                  cache: 'gradle'

            - name: Validate Gradle wrapper
              uses: gradle/actions/wrapper-validation@v3

            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v3
              with:
                  gradle-home-cache-includes: |
                      caches
                      loom-cache

            - name: Build jar
              run: ./gradlew build

            - name: Find jars
              id: find_jars
              run: |
                  {
                    echo 'jars<<EOF'
                    find build/libs -maxdepth 1 -name '*.jar' -not -name '*-sources.jar'
                    echo 'EOF'
                  } >> $GITHUB_OUTPUT

            - name: Send building message to discord
              continue-on-error: true
              env:
                  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
              if: env.DISCORD_WEBHOOK != ''
              uses: realRobotix/action-discord-notifier@master
              with:
                  webhook: ${{ secrets.DISCORD_WEBHOOK }}
                  message-title: Building Fabric port from branch ${{ steps.get_branch.outputs.branch }}

            - name: Send built file to discord
              env:
                  DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
              if: env.DISCORD_WEBHOOK != ''
              run: |
                  while IFS= read -r f
                    do curl -F "file=@\"$f\";filename=\"$(echo ${f##*/} | sed 's/+/-/g')\"" $DISCORD_WEBHOOK
                  done <<< "${{ steps.find_jars.outputs.jars }}"

            - name: Archive Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: createfly-fabric-build-${{ github.run_number }}
                  path: ${{ steps.find_jars.outputs.jars }}
