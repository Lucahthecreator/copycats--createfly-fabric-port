name: Compatibility checks

on:
  push:
    paths:
      - "build.gradle"
      - "gradle.properties"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew*"
      - "patches/**"
      - "reconstructed/**"
      - "src/compatibilityCheck/**"
      - ".github/workflows/compatibility.yml"
  pull_request:
    paths:
      - "build.gradle"
      - "gradle.properties"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew*"
      - "patches/**"
      - "reconstructed/**"
      - "src/compatibilityCheck/**"
      - ".github/workflows/compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Minecraft ${{ matrix.minecraft }} / Create Fly ${{ matrix.create }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: "26.1.2"
            create: "26.1.2-6.0.9-4"
            artifact: "26.1-universal"
          - minecraft: "26.2"
            create: "26.2-rc-2-6.0.9-1"
            artifact: "26.2-createfly-build-1"
          - minecraft: "26.2"
            create: "26.2-6.0.9-2"
            artifact: "26.2-createfly-build-2"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Build and verify the real Create Fly normal API
        run: ./gradlew build -Ptarget_version=${{ matrix.minecraft }} -Pcreate_fly_version=${{ matrix.create }} --console=plain
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: copycats-${{ matrix.artifact }}
          path: build/libs/*.jar
          if-no-files-found: error
