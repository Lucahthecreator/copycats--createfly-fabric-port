name: Release

on:
    workflow_dispatch:
    push:
        tags:
            - 'v**'
            - '!v*-dev**'

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set up JDK 25
              uses: actions/setup-java@v4
              with:
                  java-version: 25
                  distribution: temurin
                  cache: 'gradle'

            - name: Validate Gradle wrapper
              uses: gradle/actions/wrapper-validation@v3

            - name: Grant execute permission for gradlew
              run: chmod +x gradlew

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v3
              with:
                  gradle-home-cache-includes: |
                      caches
                      loom-cache

            - name: Build jar
              run: ./gradlew build

            - name: Find jars
              id: find_jars
              run: |
                  {
                    echo 'jars<<EOF'
                    find build/libs -maxdepth 1 -name '*.jar' -not -name '*-sources.jar'
                    echo 'EOF'
                  } >> $GITHUB_OUTPUT

            - name: Archive Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: createfly-fabric-release
                  path: ${{ steps.find_jars.outputs.jars }}
