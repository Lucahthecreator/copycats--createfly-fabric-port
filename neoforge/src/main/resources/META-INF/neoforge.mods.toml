modLoader="javafml"
loaderVersion="[47,)"
license="All Rights Reserved"
issueTrackerURL="https://github.com/copycats-plus/copycats/issues"
[[mods]]
   modId="copycats"
   version="${version}"
   displayName="${mod_name}"
   updateJSONURL="https://raw.githubusercontent.com/copycats-plus/copycats/multiloader/update.json"
   displayURL="https://github.com/copycats-plus/copycats"
   logoFile="copycats_icon.png"
   credits="The Create: Addon Hub Discord"
   authors="${mod_authors}"
   description='''${mod_description}'''

[[dependencies.copycats]]
   modId="neoforge"
   mandatory=true
   versionRange="[47,)"
   ordering="NONE"
   side="BOTH"
[[dependencies.copycats]]
   modId="minecraft"
   mandatory=true
   versionRange="[1.21.1,1.22)"
   ordering="NONE"
   side="BOTH"
[[dependencies.copycats]]
   modId="create"
   mandatory=true
   versionRange="${create_neoforge_range}"
   ordering="NONE"
   side="BOTH"

[[mixins]]
config = "copycats-common.mixins.json"

[[mixins]]
config = "copycats-neoforge.mixins.json"
