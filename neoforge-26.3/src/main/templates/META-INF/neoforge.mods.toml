modLoader = "javafml"
loaderVersion = "[1,)"
license = "All Rights Reserved"
issueTrackerURL = "https://github.com/Lucahthecreator/copycats--createfly-fabric-port/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "Create: Copycats+ (Create Fly, NeoForge)"
iconFile = "copycats_icon.png"
authors = "Lysine, Bennyboy1695, Redcat_XVIII; Create Fly port by lucahTheCreator; NeoForge 26.3 port by lucahTheCreator with help from the Zoompack 5 community project"
description = '''
Create: Copycats+ 3.0.7 for Create Fly, ported to NeoForge 26.3 by lucahTheCreator with help from the Zoompack 5 community project. Unofficial; based on lucahTheCreator's
Create Fly port, which is published with permission from the Copycats+ team.
'''

[[mixins]]
config = "copycats-light.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "create"
type = "required"
versionRange = "${create_version_range}"
ordering = "AFTER"
side = "BOTH"
