// NeoForge 26.3 port of Copycats+ (Create Fly port) against ZP5's NeoForge Create Fly port.
// See PORTING.md. Mirrors mods/create-fly-neoforge's build (ModDevGradle 2.0.148, Java 25).
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

def modId = project.mod_id
def createJar = file(project.create_jar)
def createInterfaces = file(project.create_interfaces)

version = "${project.mod_version}+neoforge-${project.minecraft_version}-${project.zp5_build}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Create's access transformer and injected interfaces, for compiling against Create's view of Minecraft.
// At runtime Create applies them itself.
def createDevData = tasks.register('extractCreateDevData', Sync) {
    from(zipTree(createJar)) {
        include 'META-INF/accesstransformer.cfg'
        eachFile { path = 'create-accesstransformer.cfg' }
    }
    into layout.buildDirectory.dir('create-dev')
    includeEmptyDirs = false
}

neoForge {
    version = project.neo_version

    accessTransformers {
        from file('src/main/resources/META-INF/accesstransformer.cfg')
        from layout.buildDirectory.file('create-dev/create-accesstransformer.cfg')
    }
    interfaceInjectionData {
        from createInterfaces
    }

    mods {
        "${modId}" {
            sourceSet(sourceSets.main)
        }
    }

    runs {
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', modId
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', modId
        }
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', modId
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
            if (project.hasProperty('mixinDebug')) {
                systemProperty 'mixin.debug.verbose', 'true'
                systemProperty 'mixin.debug.export', 'true'
            }
        }
    }
}

tasks.named('createMinecraftArtifacts') { dependsOn createDevData }

dependencies {
    implementation files(createJar)
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
        minecraft_version_range: project.minecraft_version_range,
        neo_version_range      : project.neo_version_range,
        create_version_range   : project.create_version_range,
        mod_id                 : modId,
        mod_version            : project.version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs += ['-Xmaxerrs', '2000']
}
